<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Robot Table Hockey - AI 플레이어 경기 리포트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
    }
    .card-container {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 26px 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 40px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(16px);
      position: relative;
    }
    .anon-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 12px;
      font-family: monospace;
      letter-spacing: 0.5px;
    }
    .badge-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .team-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .team-cyan {
      background: rgba(6, 182, 212, 0.2);
      color: #22d3ee;
      border: 1px solid rgba(34, 211, 238, 0.4);
    }
    .team-yellow {
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.4);
    }
    .result-badge {
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      line-height: 1;
      padding: 4px 14px;
      border-radius: 12px;
      letter-spacing: 1px;
    }
    .res-win {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .res-lose {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .res-draw {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }
    .hero-title {
      font-size: 25px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .growth-banner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .grade-stamp {
      position: absolute;
      top: 24px;
      right: 22px;
      font-family: 'Teko', sans-serif;
      font-size: 42px;
      line-height: 1;
      font-weight: 700;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
      border: 2.5px solid #38bdf8;
      padding: 2px 10px;
      border-radius: 12px;
      transform: rotate(8deg);
      pointer-events: none;
    }
    .score-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(2, 6, 23, 0.7);
      border-radius: 18px;
      padding: 14px;
      margin: 14px 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .score-num {
      font-family: 'Teko', sans-serif;
      font-size: 46px;
      line-height: 1;
      font-weight: 700;
    }
    .score-div {
      font-size: 20px;
      color: #64748b;
      font-weight: 700;
    }
    .radar-box {
      width: 100%;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 16px;
      position: relative;
    }
    canvas {
      display: block;
      max-width: 100%;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .stat-val {
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      line-height: 1;
      color: #f8fafc;
      font-weight: 700;
    }
    .commentary-box {
      background: rgba(30, 41, 59, 0.5);
      border-left: 3px solid #38bdf8;
      border-radius: 4px 14px 14px 4px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 20px;
    }
    .commentary-title {
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-share {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      font-size: 15px;
      font-weight: 800;
      padding: 14px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.5);
      transition: transform 0.15s ease;
    }
    .btn-share:active {
      transform: scale(0.98);
    }
    .footer-note {
      font-size: 11px;
      color: #64748b;
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="grade-stamp" id="gradeStamp">S</div>

    <!-- Anonymized ID & Match Count -->
    <div class="anon-bar">
      <span id="anonIdTag">🔒 ANON-1P-****</span>
      <span id="matchCountTag">통산 1번째 매치</span>
    </div>

    <div class="badge-bar">
      <div class="team-badge team-cyan" id="teamBadge">
        <span id="badgeIcon">⚡</span>
        <span id="teamName">1P CYAN</span>
      </div>
      <div class="result-badge res-win" id="resultBadge">WIN</div>
    </div>

    <div class="hero-title" id="archetitle">
      초음속 스트라이커
    </div>

    <!-- Cumulative Growth Badge (과거 경기와 비교한 성장치) -->
    <div class="growth-banner" id="growthBanner">
      <span>📈</span>
      <span id="growthBadgeText">개인 최고 신기록 달성!</span>
    </div>

    <!-- Match Score -->
    <div class="score-banner">
      <div style="text-align: right;">
        <div style="font-size: 11px; color: #22d3ee; font-weight: 800;">CYAN</div>
        <div class="score-num" style="color: #22d3ee;" id="scoreCyan">0</div>
      </div>
      <div class="score-div">VS</div>
      <div style="text-align: left;">
        <div style="font-size: 11px; color: #facc15; font-weight: 800;">YELLOW</div>
        <div class="score-num" style="color: #facc15;" id="scoreYellow">0</div>
      </div>
    </div>

    <!-- 5-Axis Radar Chart -->
    <div class="radar-box">
      <canvas id="radarCanvas" width="340" height="230"></canvas>
    </div>

    <!-- Metric Cards -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">최고 시속</div>
        <div class="stat-val" id="valSpeed">0 px/s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">유효 타격</div>
        <div class="stat-val" id="valHits">0회</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">스피커 반사</div>
        <div class="stat-val" id="valSpk">0회</div>
      </div>
    </div>

    <!-- Cumulative AI Comparison & Commentary -->
    <div class="commentary-box">
      <div class="commentary-title">🧠 Cumulative AI Scout Benchmarking</div>
      <div id="aiCommentary">
        경기를 분석하는 중입니다...
      </div>
    </div>

    <!-- Action Buttons -->
    <button class="btn-share" id="btnShare">
      <span>📱 리포트 공유 / 저장하기</span>
    </button>

    <div class="footer-note">
      AR Robot Table Hockey • 100% Anonymized Local Cumulative AI<br />
      개인 식별 정보(PII) 없이 순수 경기 물리 벡터만 누적 학습됩니다.
    </div>
  </div>

  <script>
    // [REQ] "이미 정해진거면 값별로 1,2,3 이런식으로 넣어서 사이트에 있는걸 불러오면"
    // 모바일 리포트 초경량 카탈로그 (URL 길이를 450자 -> 80자로 대폭 단축하여 QR 코드가 매우 단순해짐)
    const TITLE_CATALOG = [
      { ttl: '초음속 스트라이커', bdg: '⚡' },   // 0
      { ttl: '철벽의 가디언', bdg: '🛡️' },      // 1
      { ttl: '소닉 트릭마스터', bdg: '🔊' },    // 2
      { ttl: '저격형 스나이퍼', bdg: '🎯' },    // 3
      { ttl: '올라운드 마에스트로', bdg: '👑' } // 4
    ];

    const GROWTH_CATALOG = [
      { bdg: '🌱 데뷔전', summary: '첫 경기 기준 데이터가 성공적으로 등록되었습니다.' }, // 0
      { bdg: '🚀 개인 최고 신기록!', summary: '이전 역대 최고 시속을 깨고 새로운 속도 신기록을 달성했습니다!' }, // 1
      { bdg: '⚡ 스피드 급상승!', summary: '이전 경기 평균 대비 퍽 가속도가 폭발적으로 향상되었습니다.' }, // 2
      { bdg: '🔥 랠리 집중력 향상!', summary: '과거 평균 대비 유효타가 크게 증가하며 끈질긴 랠리 지속력을 보여주었습니다.' }, // 3
      { bdg: '🔊 스피커 전술 진화!', summary: '중앙 물리 스피커를 쿠션으로 활용하는 기습 굴절 뱅크샷이 돋보였습니다.' }, // 4
      { bdg: '📈 안정적 경기력 유지', summary: '이전 경기들의 패턴을 안정적으로 계승하며 침착한 경기 운영을 유지했습니다.' } // 5
    ];

    // 1. Parse URL Query Parameters (초압축 1,2,3 번호 및 기존 긴 파라미터 완전 호환)
    const params = new URLSearchParams(window.location.search);
    const p = params.get('p') || '1';
    const isBlue = p === '1';
    const team = isBlue ? 'Cyan' : 'Yellow';

    // 점수: s="5,3" 또는 s1, s2
    const rawS = params.get('s');
    let s1 = '0', s2 = '0';
    if (rawS && rawS.includes(',')) {
      const parts = rawS.split(',');
      s1 = parts[0] || '0';
      s2 = parts[1] || '0';
    } else {
      s1 = params.get('s1') || '0';
      s2 = params.get('s2') || '0';
    }

    // 스탯: st="hits,speed,speakerHits" 또는 개별
    const rawSt = params.get('st');
    let hits = '0', spd = '0', spk = '0';
    if (rawSt && rawSt.includes(',')) {
      const parts = rawSt.split(',');
      hits = parts[0] || '0';
      spd = parts[1] || '0';
      spk = parts[2] || '0';
    } else {
      hits = params.get('hits') || '0';
      spd = params.get('spd') || '0';
      spk = params.get('spk') || '0';
    }

    // 익명 ID: id="9C8E" -> "ANON-1P-9C8E"
    const shortId = params.get('id');
    const anon = shortId ? `ANON-${p}P-${shortId}` : (params.get('anon') || `ANON-${p}P-XXXX`);
    const mcount = params.get('m') || params.get('mcount') || '1';

    // 승패 판정
    const myScore = isBlue ? parseInt(s1, 10) : parseInt(s2, 10);
    const oppScore = isBlue ? parseInt(s2, 10) : parseInt(s1, 10);
    const res = myScore > oppScore ? 'WIN' : myScore < oppScore ? 'LOSE' : 'DRAW';

    // 칭호 & 배지 (인덱스 t=0..4)
    const tIdx = params.has('t') ? parseInt(params.get('t'), 10) : -1;
    let ttl = params.get('ttl');
    let bdg = params.get('bdg');
    if (tIdx >= 0 && tIdx < TITLE_CATALOG.length) {
      ttl = TITLE_CATALOG[tIdx].ttl;
      bdg = TITLE_CATALOG[tIdx].bdg;
    } else if (!ttl) {
      ttl = isBlue ? '초음속 스트라이커' : '철벽의 가디언';
      bdg = isBlue ? '⚡' : '🛡️';
    }

    // 성장 배지 & 코멘트 (인덱스 b=0..5)
    const bIdx = params.has('b') ? parseInt(params.get('b'), 10) : -1;
    let gwbdg = params.get('gwbdg');
    let growthSummary = '';
    if (bIdx >= 0 && bIdx < GROWTH_CATALOG.length) {
      gwbdg = GROWTH_CATALOG[bIdx].bdg;
      growthSummary = GROWTH_CATALOG[bIdx].summary;
    } else if (!gwbdg) {
      gwbdg = '📈 안정적 경기력 유지';
      growthSummary = '이전 경기들의 패턴을 안정적으로 계승하며 침착한 경기 운영을 유지했습니다.';
    }

    let cmm = params.get('cmm');
    if (!cmm) {
      const resultComment = res === 'WIN'
        ? `${team} 팀의 뛰어난 템포 조율과 결정력이 돋보였습니다.`
        : res === 'DRAW'
        ? '마지막 1초까지 손에 땀을 쥐게 한 팽팽한 명승부였습니다.'
        : '아쉬운 실점이 있었으나 뛰어난 순간 반응 속도를 보여주었습니다.';
      cmm = `${resultComment} ${growthSummary}`;
    }

    // 5대 스탯 자동 계산
    const nHits = parseInt(hits, 10) || 0;
    const nSpd = parseInt(spd, 10) || 0;
    const nSpk = parseInt(spk, 10) || 0;

    const atk = params.get('atk') ? parseInt(params.get('atk'), 10) : Math.min(99, Math.round(50 + myScore * 10));
    const def = params.get('def') ? parseInt(params.get('def'), 10) : Math.min(99, Math.max(30, 95 - oppScore * 12 + (res === 'WIN' ? 10 : 0)));
    const vel = params.get('vel') ? parseInt(params.get('vel'), 10) : Math.min(99, Math.max(40, Math.round((nSpd / 900) * 100)));
    const prc = params.get('prc') ? parseInt(params.get('prc'), 10) : Math.min(98, Math.max(45, Math.round(55 + (nHits > 0 ? (myScore / nHits) * 80 : 0))));
    const tac = params.get('tac') ? parseInt(params.get('tac'), 10) : Math.min(99, Math.max(50, Math.round(52 + nSpk * 8 + (res === 'WIN' ? 8 : 0))));

    const avgStat = (atk + def + vel + prc + tac) / 5;
    const grd = params.get('grd') || (avgStat >= 85 && res === 'WIN' ? 'S+' : avgStat >= 76 ? 'S' : avgStat >= 65 ? 'A' : 'B+');

    // 2. DOM Binding
    document.getElementById('anonIdTag').textContent = `🔒 ${anon}`;
    document.getElementById('matchCountTag').textContent = `통산 ${mcount}번째 매치`;
    document.getElementById('growthBadgeText').textContent = gwbdg;

    const teamBadge = document.getElementById('teamBadge');
    teamBadge.className = 'team-badge ' + (isBlue ? 'team-cyan' : 'team-yellow');
    document.getElementById('badgeIcon').textContent = bdg;
    document.getElementById('teamName').textContent = `${p}P ${team.toUpperCase()}`;

    const resBadge = document.getElementById('resultBadge');
    resBadge.textContent = res;
    resBadge.className = 'result-badge ' + (res === 'WIN' ? 'res-win' : res === 'DRAW' ? 'res-draw' : 'res-lose');

    document.getElementById('gradeStamp').textContent = grd;
    document.getElementById('gradeStamp').style.color = isBlue ? '#22d3ee' : '#facc15';
    document.getElementById('gradeStamp').style.borderColor = isBlue ? '#22d3ee' : '#facc15';

    document.getElementById('archetitle').textContent = `${bdg} ${ttl}`;
    document.getElementById('scoreCyan').textContent = s1;
    document.getElementById('scoreYellow').textContent = s2;

    document.getElementById('valSpeed').textContent = spd + ' px/s';
    document.getElementById('valHits').textContent = hits + '회';
    document.getElementById('valSpk').textContent = spk + '회';
    document.getElementById('aiCommentary').textContent = cmm;

    // 3. Render 5-Axis Radar Chart on Canvas
    function renderRadarChart() {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 78;

      const labels = ['공격력', '속도', '스피커전술', '정밀도', '수비력'];
      const values = [atk, vel, tac, prc, def].map(v => Math.max(20, Math.min(100, v)) / 100);
      const numSides = 5;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Concentric background webs (20%, 40%, 60%, 80%, 100%)
      const steps = 4;
      for (let s = 1; s <= steps; s++) {
        const r = (radius / steps) * s;
        ctx.beginPath();
        for (let i = 0; i < numSides; i++) {
          const angle = (Math.PI * 2 / numSides) * i - Math.PI / 2;
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Axis spokes & labels
      ctx.font = '11px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < numSides; i++) {
        const angle = (Math.PI * 2 / numSides) * i - Math.PI / 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.stroke();

        const labelX = cx + Math.cos(angle) * (radius + 20);
        const labelY = cy + Math.sin(angle) * (radius + 14);
        ctx.fillText(labels[i], labelX, labelY);
      }

      // Player Stat Polygon
      const strokeColor = isBlue ? '#22d3ee' : '#facc15';
      const fillColor = isBlue ? 'rgba(34, 211, 238, 0.35)' : 'rgba(250, 204, 21, 0.35)';

      ctx.beginPath();
      for (let i = 0; i < numSides; i++) {
        const angle = (Math.PI * 2 / numSides) * i - Math.PI / 2;
        const r = radius * values[i];
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Vertex dots
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < numSides; i++) {
        const angle = (Math.PI * 2 / numSides) * i - Math.PI / 2;
        const r = radius * values[i];
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    renderRadarChart();

    // 4. Share button action
    document.getElementById('btnShare').addEventListener('click', async () => {
      const shareData = {
        title: `AR Robot Table Hockey - ${p}P ${team} 리포트`,
        text: `[${bdg} ${ttl}] ${res}! ${s1} : ${s2} - ${gwbdg}`,
        url: window.location.href,
      };
      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (e) {}
      } else {
        await navigator.clipboard.writeText(window.location.href);
        alert('리포트 URL이 클립보드에 복사되었습니다! 🔗');
      }
    });
  </script>
</body>
</html>
