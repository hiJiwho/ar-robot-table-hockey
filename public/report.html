<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Robot Table Hockey - AI 플레이어 경기 리포트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
    }
    .card-container {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 26px 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 40px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(16px);
      position: relative;
    }
    .anon-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 12px;
      font-family: monospace;
      letter-spacing: 0.5px;
    }
    .badge-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .team-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .team-cyan {
      background: rgba(6, 182, 212, 0.2);
      color: #22d3ee;
      border: 1px solid rgba(34, 211, 238, 0.4);
    }
    .team-yellow {
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.4);
    }
    .result-badge {
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      line-height: 1;
      padding: 4px 14px;
      border-radius: 12px;
      letter-spacing: 1px;
    }
    .res-win {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .res-lose {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .res-draw {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }
    .hero-title {
      font-size: 25px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .growth-banner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .grade-stamp {
      position: absolute;
      top: 24px;
      right: 22px;
      font-family: 'Teko', sans-serif;
      font-size: 42px;
      line-height: 1;
      font-weight: 700;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
      border: 2.5px solid #38bdf8;
      padding: 2px 10px;
      border-radius: 12px;
      transform: rotate(8deg);
      pointer-events: none;
    }
    .score-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(2, 6, 23, 0.7);
      border-radius: 18px;
      padding: 14px;
      margin: 14px 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .score-num {
      font-family: 'Teko', sans-serif;
      font-size: 46px;
      line-height: 1;
      font-weight: 700;
    }
    .score-div {
      font-size: 20px;
      color: #64748b;
      font-weight: 700;
    }
    .radar-box {
      width: 100%;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 16px;
      position: relative;
    }
    canvas {
      display: block;
      max-width: 100%;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .stat-val {
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      line-height: 1;
      color: #f8fafc;
      font-weight: 700;
    }
    .commentary-box {
      background: rgba(30, 41, 59, 0.5);
      border-left: 3px solid #38bdf8;
      border-radius: 4px 14px 14px 4px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 20px;
    }
    .commentary-title {
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-share {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      font-size: 15px;
      font-weight: 800;
      padding: 14px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.5);
      transition: transform 0.15s ease;
    }
    .btn-share:active {
      transform: scale(0.98);
    }
    .footer-note {
      font-size: 11px;
      color: #64748b;
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="grade-stamp" id="gradeStamp">S</div>

    <!-- Anonymized ID & Match Count -->
    <div class="anon-bar">
      <span id="anonIdTag">🔒 ANON-1P-****</span>
      <span id="matchCountTag">통산 1번째 매치</span>
    </div>

    <div class="badge-bar">
      <div class="team-badge team-cyan" id="teamBadge">
        <span id="badgeIcon">⚡</span>
        <span id="teamName">1P CYAN</span>
      </div>
      <div class="result-badge res-win" id="resultBadge">WIN</div>
    </div>

    <div class="hero-title" id="archetitle">
      초음속 스트라이커
    </div>

    <!-- Cumulative Growth Badge (과거 경기와 비교한 성장치) -->
    <div class="growth-banner" id="growthBanner">
      <span>📈</span>
      <span id="growthBadgeText">개인 최고 신기록 달성!</span>
    </div>

    <!-- Match Score -->
    <div class="score-banner">
      <div style="text-align: right;">
        <div style="font-size: 11px; color: #22d3ee; font-weight: 800;">CYAN</div>
        <div class="score-num" style="color: #22d3ee;" id="scoreCyan">0</div>
      </div>
      <div class="score-div">VS</div>
      <div style="text-align: left;">
        <div style="font-size: 11px; color: #facc15; font-weight: 800;">YELLOW</div>
        <div class="score-num" style="color: #facc15;" id="scoreYellow">0</div>
      </div>
    </div>

    <!-- 5-Axis Radar Chart -->
    <div class="radar-box">
      <canvas id="radarCanvas" width="340" height="230"></canvas>
    </div>

    <!-- Metric Cards -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">최고 시속</div>
        <div class="stat-val" id="valSpeed">0 px/s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">유효 타격</div>
        <div class="stat-val" id="valHits">0회</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">스피커 반사</div>
        <div class="stat-val" id="valSpk">0회</div>
      </div>
    </div>

    <!-- Cumulative AI Comparison & Commentary -->
    <div class="commentary-box">
      <div class="commentary-title">🧠 Cumulative AI Scout Benchmarking</div>
      <div id="aiCommentary">
        경기를 분석하는 중입니다...
      </div>
    </div>

    <!-- Action Buttons -->
    <button class="btn-share" id="btnShare">
      <span>📱 리포트 공유 / 저장하기</span>
    </button>

    <div class="footer-note">
      AR Robot Table Hockey • 100% Anonymized Local Cumulative AI<br />
      개인 식별 정보(PII) 없이 순수 경기 물리 벡터만 누적 학습됩니다.
    </div>
  </div>

  <script>
    // [REQ] "최대한 약간 서버에 등록한 ID 느낌으로 해줘 ㅋㅋ 그래서 위조시 404 에러 뜨개 ㅋㅋ ?ID="
    const SECRET_SEED = 0x7A3F9B5D;
    const S_BOX = [
      0x63, 0x7c, 0x77, 0x7b, 0xf2, 0x6b, 0x6f, 0xc5, 0x30, 0x01, 0x67, 0x2b, 0xfe, 0xd7, 0xab, 0x76,
      0xca, 0x82, 0xc9, 0x7d, 0xfa, 0x59, 0x47, 0xf0, 0xad, 0xd4, 0xa2, 0xaf, 0x9c, 0xa4, 0x72, 0xc0
    ];

    function calcHMAC(str) {
      let h = 0x811c9dc5 ^ SECRET_SEED;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 0x01000193);
        h = (h << 5) | (h >>> 27);
      }
      return ((h >>> 0) & 0xffffffff).toString(16).padStart(8, '0').toUpperCase();
    }

    function decodeServerMatchId(matchId) {
      try {
        if (!matchId) return null;
        let clean = matchId.trim();
        if (clean.startsWith('REC-')) clean = clean.slice(4);
        else if (clean.startsWith('M-')) clean = clean.slice(2);
        else return null;

        const hex = clean.replace(/-/g, '');
        if (hex.length % 2 !== 0) return null;

        let raw = '';
        for (let i = 0; i < hex.length; i += 2) {
          const enc = parseInt(hex.slice(i, i + 2), 16);
          if (isNaN(enc)) return null;
          const idx = (i / 2) | 0;
          const s = S_BOX[idx % S_BOX.length];
          const c = (enc ^ s ^ ((SECRET_SEED >> ((idx % 4) * 8)) & 0xff)) & 0xff;
          raw += String.fromCharCode(c);
        }
        const parts = raw.split(':');
        if (parts.length !== 2) return null;
        const payload = parts[0];
        const sig = parts[1];
        if (calcHMAC(payload) !== sig) return null; // 위조 시 404 차단!
        return payload;
      } catch (e) {
        return null;
      }
    }

    // 모바일 리포트 카탈로그
    const TITLE_CATALOG = [
      { ttl: '초음속 스트라이커', bdg: '⚡' },   // 0
      { ttl: '철벽의 가디언', bdg: '🛡️' },      // 1
      { ttl: '소닉 트릭마스터', bdg: '🔊' },    // 2
      { ttl: '저격형 스나이퍼', bdg: '🎯' },    // 3
      { ttl: '올라운드 마에스트로', bdg: '👑' } // 4
    ];

    const GROWTH_CATALOG = [
      { bdg: '🌱 데뷔전', summary: '첫 경기 기준 데이터가 성공적으로 등록되었습니다.' }, // 0
      { bdg: '🚀 개인 최고 신기록!', summary: '이전 역대 최고 시속을 깨고 새로운 속도 신기록을 달성했습니다!' }, // 1
      { bdg: '⚡ 스피드 급상승!', summary: '이전 경기 평균 대비 퍽 가속도가 폭발적으로 향상되었습니다.' }, // 2
      { bdg: '🔥 랠리 집중력 향상!', summary: '과거 평균 대비 유효타가 크게 증가하며 끈질긴 랠리 지속력을 보여주었습니다.' }, // 3
      { bdg: '🔊 스피커 전술 진화!', summary: '중앙 물리 스피커를 쿠션으로 활용하는 기습 굴절 뱅크샷이 돋보였습니다.' }, // 4
      { bdg: '📈 안정적 경기력 유지', summary: '이전 경기들의 패턴을 안정적으로 계승하며 침착한 경기 운영을 유지했습니다.' } // 5
    ];

    const params = new URLSearchParams(window.location.search);
    const rawId = params.get('ID') || params.get('id') || params.get('d');

    let p = '1';
    let myScore = 0;
    let oppScore = 0;
    let hits = '0', spd = '0', spk = '0';
    let tIdx = 0, bIdx = 0;
    let mcount = '1';
    let shortId = 'XXXX';
    let isNotFound = false;

    if (!rawId) {
      isNotFound = true;
    } else {
      const decoded = decodeServerMatchId(rawId);
      if (!decoded) {
        isNotFound = true; // [REQ] 위조 또는 미등록 시 404 에러 트리거!
      } else {
        // [REQ] "스코어는 앞이 본인, 뒤가 상대"
        // payload format: p,myScore,oppScore,hits,maxPuckSpeed,speakerHits,titleIdx,growthIdx,matchNum,shortId
        const parts = decoded.split(',');
        p = parts[0] || '1';
        myScore = parseInt(parts[1] || '0', 10);
        oppScore = parseInt(parts[2] || '0', 10);
        hits = parts[3] || '0';
        spd = parts[4] || '0';
        spk = parts[5] || '0';
        tIdx = parseInt(parts[6] || '0', 10);
        bIdx = parseInt(parts[7] || '0', 10);
        mcount = parts[8] || '1';
        shortId = parts[9] || 'XXXX';
      }
    }

    // [REQ] 리얼 404 Not Found 화면 연출! (위조하려던 사람이 "어? 진짜 서버에 없는 경기네?" 하고 속아 넘어가게 만듦)
    if (isNotFound) {
      document.title = '404 Not Found - AR Table Hockey Match Database';
      document.body.innerHTML = `
        <div style="min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px;">
          <div style="font-size: 88px; font-weight: 900; line-height: 1; letter-spacing: -3px; color: #f43f5e; text-shadow: 0 0 30px rgba(244, 63, 94, 0.4); margin-bottom: 8px;">
            404
          </div>
          <div style="font-size: 13px; font-weight: 800; color: #fda4af; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px;">
            Match Session Record Not Found
          </div>
          <p style="font-size: 14px; color: #94a3b8; max-width: 380px; line-height: 1.6; margin-bottom: 24px;">
            요청하신 경기 세션 식별자(<code style="color: #f1f5f9; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 12px;">${rawId ? (rawId.slice(0, 18) + '...') : 'NULL'}</code>)가 서버 데이터베이스에 존재하지 않거나, 보안 서명이 위변조되어 만료되었습니다.
          </p>
          <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 14px 18px; font-size: 12px; color: #64748b; text-align: left; max-width: 360px; width: 100%; margin-bottom: 24px;">
            <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
              <span>Error Code:</span><strong style="color: #e2e8f0;">ERR_MATCH_UNREGISTERED</strong>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
              <span>Timestamp:</span><span style="color: #94a3b8;">${new Date().toISOString()}</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
              <span>Server Node:</span><span style="color: #38bdf8;">kr-seoul-edge-01</span>
            </div>
          </div>
          <a href="javascript:location.reload()" style="padding: 10px 24px; font-size: 13px; font-weight: 700; color: #fff; background: #334155; border-radius: 10px; text-decoration: none; transition: background 0.2s;">
            새로고침
          </a>
        </div>
      `;
      throw new Error('404 Match Session Record Not Found');
    }

    const isBlue = p === '1';
    const team = isBlue ? 'Cyan' : 'Yellow';
    const anon = `ANON-${p}P-${shortId}`;

    // 스코어 매핑: 앞=본인(myScore), 뒤=상대(oppScore)
    const s1 = isBlue ? myScore : oppScore; // Cyan 점수
    const s2 = isBlue ? oppScore : myScore; // Yellow 점수
    const res = myScore > oppScore ? 'WIN' : myScore < oppScore ? 'LOSE' : 'DRAW';

    // 칭호 & 배지
    const titleObj = TITLE_CATALOG[Math.max(0, Math.min(TITLE_CATALOG.length - 1, tIdx))] || TITLE_CATALOG[0];
    const ttl = titleObj.ttl;
    const bdg = titleObj.bdg;

    // 성장 배지 & 코멘트
    const growthObj = GROWTH_CATALOG[Math.max(0, Math.min(GROWTH_CATALOG.length - 1, bIdx))] || GROWTH_CATALOG[0];
    const gwbdg = growthObj.bdg;
    const growthSummary = growthObj.summary;

    const resultComment = res === 'WIN'
      ? `${team} 팀의 뛰어난 템포 조율과 결정력이 돋보였습니다.`
      : res === 'DRAW'
      ? '마지막 1초까지 손에 땀을 쥐게 한 팽팽한 명승부였습니다.'
      : '아쉬운 실점이 있었으나 뛰어난 순간 반응 속도를 보여주었습니다.';
    const cmm = `${resultComment} ${growthSummary}`;

    // 5대 스탯 자동 계산
    const nHits = parseInt(hits, 10) || 0;
    const nSpd = parseInt(spd, 10) || 0;
    const nSpk = parseInt(spk, 10) || 0;

    const atk = Math.min(99, Math.round(50 + myScore * 10));
    const def = Math.min(99, Math.max(30, 95 - oppScore * 12 + (res === 'WIN' ? 10 : 0)));
    const vel = Math.min(99, Math.max(40, Math.round((nSpd / 900) * 100)));
    const prc = Math.min(98, Math.max(45, Math.round(55 + (nHits > 0 ? (myScore / nHits) * 80 : 0))));
    const tac = Math.min(99, Math.max(50, Math.round(52 + nSpk * 8 + (res === 'WIN' ? 8 : 0))));

    const avgStat = (atk + def + vel + prc + tac) / 5;
    const grd = avgStat >= 85 && res === 'WIN' ? 'S+' : avgStat >= 76 ? 'S' : avgStat >= 65 ? 'A' : 'B+';

    // 2. DOM Binding
    document.getElementById('anonIdTag').textContent = `🔒 ${anon}`;
    document.getElementById('matchCountTag').textContent = `통산 ${mcount}번째 매치`;
    document.getElementById('growthBadgeText').textContent = gwbdg;

    const teamBadge = document.getElementById('teamBadge');
    teamBadge.className = 'team-badge ' + (isBlue ? 'team-cyan' : 'team-yellow');
    document.getElementById('badgeIcon').textContent = bdg;
    document.getElementById('teamName').textContent = `${p}P ${team.toUpperCase()} (본인)`;

    const resBadge = document.getElementById('resultBadge');
    resBadge.textContent = res;
    resBadge.className = 'result-badge ' + (res === 'WIN' ? 'res-win' : res === 'DRAW' ? 'res-draw' : 'res-lose');

    document.getElementById('gradeStamp').textContent = grd;
    document.getElementById('gradeStamp').style.color = isBlue ? '#22d3ee' : '#facc15';
    document.getElementById('gradeStamp').style.borderColor = isBlue ? '#22d3ee' : '#facc15';

    document.getElementById('archetitle').textContent = `${bdg} ${ttl}`;
    document.getElementById('scoreCyan').textContent = s1;
    document.getElementById('scoreYellow').textContent = s2;

    document.getElementById('valSpeed').textContent = spd + ' px/s';
    document.getElementById('valHits').textContent = hits + '회';
    document.getElementById('valSpk').textContent = spk + '회';
    document.getElementById('aiCommentary').textContent = cmm;

    // 3. Render 5-Axis Radar Chart on Canvas
    function renderRadarChart() {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 78;

      const labels = ['공격력', '속도', '스피커전술', '정밀도', '수비력'];
      const values = [atk, vel, tac, prc, def].map(v => Math.max(20, Math.min(100, v)) / 100);
      const numSides = 5;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Concentric background webs (20%, 40%, 60%, 80%, 100%)
      const steps = 4;
      for (let s = 1; s <= steps; s++) {
        const r = (radius / steps) * s;
        ctx.beginPath();
        for (let i = 0; i < numSides; i++) {
          const angle = (Math.PI * 2 / numSides) * i - Math.PI / 2;
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Axis spokes & labels
      ctx.font = '11px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < numSides; i++) {
        const angle = (Math.PI * 2 / numSides) * i - Math.PI / 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.stroke();

        const labelX = cx + Math.cos(angle) * (radius + 20);
        const labelY = cy + Math.sin(angle) * (radius + 14);
        ctx.fillText(labels[i], labelX, labelY);
      }

      // Player Stat Polygon
      const strokeColor = isBlue ? '#22d3ee' : '#facc15';
      const fillColor = isBlue ? 'rgba(34, 211, 238, 0.35)' : 'rgba(250, 204, 21, 0.35)';

      ctx.beginPath();
      for (let i = 0; i < numSides; i++) {
        const angle = (Math.PI * 2 / numSides) * i - Math.PI / 2;
        const r = radius * values[i];
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Vertex dots
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < numSides; i++) {
        const angle = (Math.PI * 2 / numSides) * i - Math.PI / 2;
        const r = radius * values[i];
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    renderRadarChart();

    // 4. Share button action
    document.getElementById('btnShare').addEventListener('click', async () => {
      const shareData = {
        title: `AR Robot Table Hockey - ${p}P ${team} 리포트`,
        text: `[${bdg} ${ttl}] ${res}! ${s1} : ${s2} - ${gwbdg}`,
        url: window.location.href,
      };
      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (e) {}
      } else {
        await navigator.clipboard.writeText(window.location.href);
        alert('리포트 URL이 클립보드에 복사되었습니다! 🔗');
      }
    });
  </script>
